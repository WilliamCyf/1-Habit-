# Robot instructions for GitHub: every time new code is pushed, test it,
# build the site, and publish it to GitHub Pages (free https hosting).
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/workout-coach-pwa-8mz5oc
  workflow_dispatch:

# The minimum permissions the publish step needs.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes arrive close together, only publish the newest one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install the exact library versions from package-lock.json
        run: npm ci
      - name: Run the automated tests (a failing test blocks the publish)
        run: npm test
      - name: Build the site into the dist folder
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
